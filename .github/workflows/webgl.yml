name: Build WebGL (Buildalon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch exported project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -p project.tar.gz
          mkdir project
          tar -xzf project.tar.gz -C project
          rm project.tar.gz

      - name: Patch Project Settings and Cleanup
        run: |
          # 1. Remove Steam plugins and scripts
          find project -iname 'Facepunch.Steamworks*' -delete
          find project -iname 'steam_api*' -delete
          find project/Assets -name AchievementTest.cs -exec cp ci/AchievementTest.cs {} \;
          find project/Assets -name SteamTest.cs -exec cp ci/SteamTest.cs {} \;
          
          # 2. Remove Steam references from .asmdef files
          python3 - <<'PYEOF'
          import glob, json
          for p in glob.glob('project/Assets/**/*.asmdef', recursive=True):
              d = json.load(open(p, encoding='utf-8-sig'))
              for k in ('references', 'precompiledReferences'):
                  if k in d:
                      d[k] = [x for x in d[k] if 'steam' not in x.lower()]
              json.dump(d, open(p, 'w', encoding='utf-8'), indent=2)
          PYEOF
          
          # 3. Rename duplicate audio file
          if [ -f "project/Assets/AudioClip/clickSound.ogg" ]; then
            mv "project/Assets/AudioClip/clickSound.ogg" "project/Assets/AudioClip/clickSound_lower.ogg"
            mv "project/Assets/AudioClip/clickSound.ogg.meta" "project/Assets/AudioClip/clickSound_lower.ogg.meta"
          fi
          
          # 4. Change Color Space and Compression
          python3 - <<'PYEOF'
          import re
          import sys
          
          file_path = 'project/ProjectSettings/ProjectSettings.asset'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          new_content, count1 = re.subn(r'(m_ActiveColorSpace:\s*)\d+', r'\g<1>0', content)
          if count1 != 1: sys.exit(1)
              
          new_content, count2 = re.subn(r'(webGLCompressionFormat:\s*)\d+', r'\g<1>2', new_content)
          if count2 != 1: sys.exit(1)
          
          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(new_content)
          print("Successfully patched ColorSpace and Compression.")
          PYEOF

      - name: Fix recovered-project problems
        run: |
          python3 - <<'PYEOF'
          import shutil, os

          # WebGL has no compute shaders, and these exported ones are broken
          shutil.rmtree('project/Assets/ComputeShader', ignore_errors=True)
          if os.path.exists('project/Assets/ComputeShader.meta'):
              os.remove('project/Assets/ComputeShader.meta')

          # Nightmare scene shares SampleScene's GUID; give it its own
          old = '9fc0d4010bbf28b4594072e72b8655ab'
          new = '60d859c6485049e8972169b0cd25e604'

          p = 'project/Assets/Scenes/Nightmare.unity.meta'
          s = open(p, encoding='utf-8').read()
          assert old in s
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))

          p = 'project/ProjectSettings/EditorBuildSettings.asset'
          s = open(p, encoding='utf-8').read()
          parts = s.split(old)
          assert len(parts) == 3, len(parts)
          open(p, 'w', encoding='utf-8').write(parts[0] + old + parts[1] + new + parts[2])
          print('Patched compute shaders and scene GUID')
          PYEOF

      - name: Fix /home/packer permission bug
        run: sudo rm -rf /home/packer

      - name: Setup Unity Editor
        uses: buildalon/unity-setup@v3
        with:
          version-file: 'None'
          unity-version: '2020.3.40f1 (ba48d4efcef1)'
          build-targets: 'WebGL'
          allow-security-alert: true
          cache-installation: true

      - name: Activate Unity Personal License
        uses: buildalon/activate-unity-license@v3
        with:
          license: 'personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Add Buildalon Build Pipeline Package
        working-directory: project
        run: |
          npm install -g openupm-cli
          openupm add com.virtualmaker.buildalon

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: project/Library
          key: Library-WebGL-${{ hashFiles('project/Assets/**', 'project/Packages/**', 'project/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL Project
        uses: buildalon/unity-action@v3
        with:
          project-path: 'project'
          build-target: 'WebGL'
          # We left the worker count in, just in case
          args: '-quit -batchmode -nographics -job-worker-count 1 -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild'

      - name: Prepare Artifact for Pages
        run: |
          set -e

          echo "Searching for WebGL index.html..."
          mapfile -t INDEX_FILES < <(
            find project/Builds/WebGL -name index.html -type f
          )

          if [ "${#INDEX_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one index.html, found ${#INDEX_FILES[@]}"
            printf '%s\n' "${INDEX_FILES[@]}"
            exit 1
          fi

          BUILD_DIR="$(dirname "${INDEX_FILES[0]}")"

          echo "Using build directory: $BUILD_DIR"

          mkdir -p pages-artifact
          cp -a "$BUILD_DIR/." pages-artifact/

          test -f pages-artifact/index.html

          echo "Pages artifact contents:"
          ls -lah pages-artifact

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
